server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Option 1: Capture from Docker containers (if backend runs in Docker)
  - job_name: motogo-backend-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["motogo-backend"]
    
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:

  # Option 2: Capture from log file (for local development with go run)
  - job_name: motogo-backend-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: motogo-backend
          container: motogo-backend
          __path__: /var/log/motogo/backend-*.log
    
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
