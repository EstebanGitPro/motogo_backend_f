# golangci-lint configuration
# Run with: golangci-lint run ./...

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - docs
    - bin
    - mocks

linters:
  enable:
    # Default linters
    - errcheck # Check for unchecked errors
    - gosimple # Simplify code
    - govet # Reports suspicious constructs
    - ineffassign # Detects ineffectual assignments
    - staticcheck # Go static analysis
    - unused # Checks for unused code

    # Additional recommended linters
    - bodyclose # Checks whether HTTP response body is closed
    - contextcheck # Check context.Context usage
    - dupl # Code clone detection
    - errname # Checks error naming conventions
    - errorlint # Find code that will cause problems with error wrapping
    - gocognit # Computes cognitive complexity
    - goconst # Finds repeated strings that could be constants
    - gocritic # Extensible Go linter
    - gocyclo # Computes cyclomatic complexity
    - gofmt # Checks code formatting
    - goimports # Checks import order
    - gosec # Security issues
    - misspell # Finds commonly misspelled words
    - nakedret # Finds naked returns
    - nilerr # Finds errors not returned
    - prealloc # Slice preallocation
    - predeclared # Finds shadowed predeclared identifiers
    - revive # Fast, configurable linter
    - unconvert # Unnecessary type conversions
    - unparam # Reports unused function parameters
    - whitespace # Checks for unnecessary whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  gocognit:
    min-complexity: 20

  gocyclo:
    min-complexity: 15

  goconst:
    min-len: 3
    min-occurrences: 3

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam # Allow large params for now

  gosec:
    excludes:
      - G104 # Unhandled errors (too noisy)

  revive:
    rules:
      - name: exported
        severity: warning
      - name: package-comments
        severity: warning
      - name: blank-imports
        severity: warning

  dupl:
    threshold: 150

issues:
  exclude-rules:
    # Exclude test files from some linters
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - goconst

    # Exclude mocks from all linting
    - path: mocks/
      linters:
        - all

    # Allow fmt.Println in main
    - path: cmd/
      linters:
        - forbidigo

  max-issues-per-linter: 50
  max-same-issues: 10
