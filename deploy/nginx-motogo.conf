# ============================================
# Nginx - MotoGo API (reverse proxy)
# ============================================
# Ubicación en servidor: /etc/nginx/sites-available/motogo
# Activar: ln -s /etc/nginx/sites-available/motogo /etc/nginx/sites-enabled/
# Reemplazar "tudominio.com" por tu dominio real

# --- API Backend ---
server {
    listen 80;
    server_name api.tudominio.com;

    # Redirect HTTP → HTTPS (Certbot lo configura automáticamente)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.tudominio.com;

    # Los certificados SSL los genera Certbot automáticamente
    # ssl_certificate /etc/letsencrypt/live/api.tudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.tudominio.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# --- Keycloak Auth ---
server {
    listen 80;
    server_name auth.tudominio.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name auth.tudominio.com;

    # ssl_certificate /etc/letsencrypt/live/auth.tudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/auth.tudominio.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keycloak necesita headers grandes para los tokens
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
