services:
  # MySQL para la aplicación principal
  mysql-app:
    image: mysql:8.0
    container_name: motogo-mysql-app
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: motogoDb
      TZ: America/Bogota
    volumes:
      - mysql-app-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
    networks:
      - motogo-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MySQL para Keycloak
  mysql-keycloak:
    image: mysql:8.0
    container_name: motogo-mysql-keycloak
    restart: unless-stopped
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_KC_ROOT_PASSWORD}"
      MYSQL_DATABASE: keydb
      TZ: America/Bogota
    volumes:
      - mysql-keycloak-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
    networks:
      - motogo-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_KC_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Keycloak
  keycloak:
    build:
      context: .
      dockerfile: Containerfile
    image: motogo-keycloak:latest
    container_name: keycloak-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9000:9000"
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql-keycloak:3306/keydb
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: "${MYSQL_KC_ROOT_PASSWORD}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_HOSTNAME: "${KC_HOSTNAME}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
    depends_on:
      mysql-keycloak:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    networks:
      - motogo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  mysql-app-data:
    driver: local
  mysql-keycloak-data:
    driver: local

networks:
  motogo-network:
    driver: bridge
