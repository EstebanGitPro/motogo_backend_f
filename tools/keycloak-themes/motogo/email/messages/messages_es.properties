# MotoGo Email Messages - Spanish
# Email Verification
emailVerificationSubject=Verifica tu correo - MotoGo 
emailVerificationBody=Hola,\n\nGracias por registrarte en MotoGo. Para activar tu cuenta, haz clic en el siguiente enlace:\n\n{1}\n\nEste enlace expira en 15 minutos.\n\nSi no fuiste tú quien se registró, ignora este mensaje.\n\nSaludos,\nEquipo MotoGo

