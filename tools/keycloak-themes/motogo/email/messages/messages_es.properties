# Password Reset
passwordResetSubject=Recuperación de contraseña - MotoGo 
passwordResetBody=Hola {0},\n\nRecibimos una solicitud para restablecer tu contraseña en MotoGo.\n\nSi fuiste tú, haz clic en el siguiente enlace:\n\n{1}\n\nEste enlace expira en 12 horas.\n\nSi no solicitaste esto, ignora este mensaje. Tu contraseña permanece segura.\n\nSaludos,\nEquipo MotoGo

passwordResetBodyHtml=<p>Hola <strong>{0}</strong>,</p><p>Recibimos una solicitud para restablecer tu contraseña en <strong>MotoGo</strong>.</p>

