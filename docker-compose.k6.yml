services:
  k6:
    image: grafana/k6:latest
    container_name: motogo-k6
    volumes:
      - ./platform/k6:/scripts
    ports:
      - "6565:6565"
    environment:
      - K6_OUT=json=/scripts/results.json
    command: run /scripts/script.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - motogo-network

networks:
  motogo-network:
    driver: bridge
