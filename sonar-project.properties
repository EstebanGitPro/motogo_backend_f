# ============================================
# SonarCloud Configuration - MotoGo Backend
# ============================================

# Identificación del proyecto (confirmado de SonarCloud)
sonar.projectKey=EstebanGitPro_motogo_backend_f
sonar.organization=estebangitpro

# Metadata
sonar.projectName=MotoGo Backend
sonar.projectVersion=0.13.0

# Fuentes
sonar.sources=.
sonar.exclusions=**/vendor/**,**/*_test.go,**/mocks/**,**/docs/**,**/documents_motogo/**,**/tools/**,**/scripts/**,**/platform/swaggo/**,**/bin/**,**/cmd/**,**/server/**

# Tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Cobertura — Go usa el formato nativo
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8

# Calidad
sonar.qualitygate.wait=true
