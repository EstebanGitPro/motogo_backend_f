services:
  grafana:
    build:
      context: ./platform/grafana
      dockerfile: Dockerfile
    image: motogo-grafana:11.3.0
    container_name: motogo-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./platform/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./platform/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
    networks:
      - motogo-network
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: motogo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./platform/prometheus/prometheus-motogo.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - motogo-network

volumes:
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  motogo-network:
    driver: bridge
